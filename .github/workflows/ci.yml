name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fail if dist/ drifted from src/. Contributors must commit dist
      # because GitHub runners execute the bundled output directly.
      - name: Verify dist is in sync with src
        run: |
          if ! git diff --quiet --exit-code -- dist/; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit the result."
            git --no-pager diff -- dist/
            exit 1
          fi
