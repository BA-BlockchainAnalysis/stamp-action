name: 'BA | Stamp'
description: 'Anchor file hashes on Polygon + Bitcoin via OpenTimestamps. Legal-grade timestamps for CI artifacts.'
author: 'Aletheia Tech Ltd'

branding:
  icon: 'clock'
  color: 'green'

inputs:
  api-key:
    description: 'BA Stamp API key (ba_live_...). Mint at https://bastamp.com/account/api-keys.'
    required: true
  files:
    description: 'Newline-separated globs of files to stamp. Each matched file is hashed locally; only the SHA-256 is sent.'
    required: true
  jurisdiction:
    description: 'ISO 3166-1 alpha-2 country code applied to the certificate legal framing (e.g. IT, US, DE).'
    required: false
  locale:
    description: 'BCP-47 locale for the certificate PDF (e.g. en, it, fr).'
    required: false
    default: 'en'
  wait-for-anchor:
    description: 'If true, poll until every stamp is Polygon-anchored (~5 min). Does NOT wait on the Bitcoin/OpenTimestamps anchor — that confirms 1–6h later asynchronously; subscribe to the ots.upgraded webhook for it. Adds CI minutes; defaults to false.'
    required: false
    default: 'false'
  poll-timeout-seconds:
    description: 'Maximum seconds to wait when wait-for-anchor=true. Default 900 (15 min).'
    required: false
    default: '900'
  output-json:
    description: 'Path to write the proofs JSON output. Default: bastamp-proofs.json.'
    required: false
    default: 'bastamp-proofs.json'
  api-base:
    description: 'Override API base URL. Defaults to https://bastamp.com/api/v1.'
    required: false
    default: 'https://bastamp.com/api/v1'
  download-certificates:
    description: 'If true, download the certificate PDF of every anchored stamp into certificates-dir. Certificates only exist once anchored, so pair this with wait-for-anchor: true. Implied by attach-to-release.'
    required: false
    default: 'false'
  certificates-dir:
    description: 'Directory to write downloaded certificate PDFs into. Default: bastamp-certificates.'
    required: false
    default: 'bastamp-certificates'
  attach-to-release:
    description: 'A release tag (e.g. the tag that triggered the workflow). When set, the downloaded certificate PDFs are uploaded as assets on that release. Implies download-certificates. Requires github-token with contents: write.'
    required: false
    default: ''
  github-token:
    description: 'Token used to upload release assets when attach-to-release is set. Pass ${{ github.token }} and give the job contents: write permission.'
    required: false
    default: ''

outputs:
  stamps:
    description: 'JSON-encoded array of stamped items: { ownershipId, stampId, contentHash, fileName, anchored, txHash? }.'
  pending-count:
    description: 'Number of stamps not yet Polygon-anchored at exit. 0 when wait-for-anchor=true completed successfully.'
  anchored-count:
    description: 'Number of stamps Polygon-anchored at exit. Bitcoin/OTS confirmation lands later asynchronously.'
  credits-charged:
    description: 'Total credits charged across all batches in this run.'
  certificates:
    description: 'JSON-encoded array of downloaded certificates: { contentHash, fileName, path }. Empty unless download-certificates (or attach-to-release) is set.'

runs:
  using: 'node20'
  main: 'dist/index.js'
